<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soli Tools - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="login-container" class="container">
        <div class="login-box">
            <h1>Soli Tools</h1>
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username:</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="btn-submit">Login</button>
                <p id="login-error" class="error-message"></p>
            </form>
        </div>
    </div>

    <div id="app-container" class="container" style="display: none;">
        <div class="app-header">
            <h1>Soli Tools - Dashboard</h1>
            <button id="logout-btn" class="btn-logout">Logout</button>
        </div>

        <div class="dashboard-content">
            <div class="chart-section">
                <div class="chart-header">
                    <h2>Data Statistics</h2>
                    <div class="chart-filter" style="display: none;">
                        <label for="ingredient-filter">Filter by Type:</label>
                        <select id="ingredient-filter">
                            <option value="all">Show All</option>
                        </select>
                    </div>
                </div>
                <div id="charts-container"></div>
            </div>

            <div class="actions-section">
                <!-- Temporarily hidden add button -->
                <!-- <button id="add-data-btn" class="btn-primary">+ Add New Data</button> -->
            </div>
        </div>
    </div>

    <!-- Input Modal for Editing Quantities -->
    <div id="input-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Nhập dữ liệu nguyên liệu</h2>
                <span class="close-btn" id="close-input-modal">&times;</span>
            </div>
            <div class="modal-body">
                <div class="display-type">
                    <label class="readonly-label">Loại nguyên liệu:</label>
                    <div class="readonly-field" id="display-type"></div>
                </div>
                <div id="ingredients-list" class="ingredients-list"></div>
            </div>
            <div class="modal-footer">
                <button id="save-input-btn" class="btn-save">Lưu thay đổi</button>
                <button id="cancel-input-btn" class="btn-cancel">Hủy thay đổi</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
