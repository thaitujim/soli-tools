<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soli Tools - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="login-container" class="container">
        <div class="login-box">
            <h1>Soli Tools</h1>
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username:</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="btn-submit">Login</button>
                <p id="login-error" class="error-message"></p>
            </form>
        </div>
    </div>

    <div id="app-container" class="container" style="display: none;">
        <div class="app-header">
            <h1>Soli Tools - Dashboard</h1>
            <button id="logout-btn" class="btn-logout">Logout</button>
        </div>

        <div class="dashboard-content">
            <div class="chart-section">
                <div class="chart-header">
                    <h2>Data Statistics</h2>
                    <div class="chart-filter">
                        <label for="ingredient-filter">Filter by Type:</label>
                        <select id="ingredient-filter">
                            <option value="all">Show All</option>
                        </select>
                    </div>
                </div>
                <div id="charts-container"></div>
            </div>

            <div class="actions-section">
                <button id="add-data-btn" class="btn-primary">+ Add New Data</button>
            </div>
        </div>
    </div>

    <!-- Modal for Add/Update Data -->
    <div id="data-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Add New Data</h2>
                <button id="close-modal-btn" class="btn-close">&times;</button>
            </div>
            <form id="data-form">
                <div class="form-group">
                    <label for="name">Name (Column A):</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="value">Value (Column B):</label>
                    <input type="text" id="value" name="value" required>
                </div>
                <div class="modal-footer">
                    <button type="button" id="cancel-btn" class="btn-secondary">Cancel</button>
                    <button type="submit" class="btn-submit">Submit</button>
                </div>
                <p id="form-message" class="message"></p>
            </form>
        </div>
    </div>
    <!-- <div id="modal-backdrop" class="modal-backdrop" style="display: none;"></div>
                    <textarea id="message" name="message" rows="4" required></textarea>
                </div>
                <div class="modal-footer">
                    <button type="button" id="cancel-btn" class="btn-secondary">Cancel</button>
                    <button type="submit" class="btn-submit">Submit</button>
                </div>
                <p id="form-message" class="message"></p>
            </form>
        </div>
    </div> -->
    <div id="modal-backdrop" class="modal-backdrop" style="display: none;"></div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
